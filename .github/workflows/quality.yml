name: Qualidade funcional e pacote
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Compilar
        run: python -m compileall -q app.py core tests
      - name: Testes automatizados
        run: pytest -q
      - name: Validar identidade visual protegida
        run: pytest -q tests/test_identidade_visual_lock.py
      - name: Validacao visual Streamlit Playwright
        run: |
          mkdir -p artifacts
          streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8555 > artifacts/streamlit.log 2>&1 &
          STREAMLIT_PID=$!
          trap 'kill $STREAMLIT_PID 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8555/_stcore/health', timeout=2) as r:
                      if r.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Streamlit nao ficou pronto em 60 segundos')
          PY
          python tests/visual_capture.py
      - name: Publicar evidencias visuais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc16-validacao-visual
          path: artifacts/**
          if-no-files-found: warn
      - name: Montar pacote de avaliacao
        run: |
          mkdir -p pacote
          cp app.py pacote/
          cp requirements.txt pacote/ 2>/dev/null || true
          cp requirements-dev.txt pacote/ 2>/dev/null || true
          cp -r core pacote/core
          for d in assets .streamlit; do [ -d "$d" ] && cp -r "$d" "pacote/$d"; done
          for f in *.bat *.cmd *.ps1 README*; do [ -f "$f" ] && cp "$f" pacote/; done
          printf "V11.34 RC16 - AVALIACAO\nCommit: %s\n" "${GITHUB_SHA}" > pacote/VERSAO.txt
      - name: Publicar V11.34 RC16 avaliacao
        uses: actions/upload-artifact@v4
        with:
          name: V11.34-RC16-AVALIACAO
          path: pacote/**
          if-no-files-found: error
